[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "media-downloader-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "media-downloader-core==0.1.0",
  "redis>=5,<7",
  "rq>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

